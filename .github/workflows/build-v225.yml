name: Build BRES V2.25 direct index

on:
  push:
    branches: [main]
    paths:
      - 'v225-01.b64'
      - 'v225-02.b64'
      - 'v225-03.b64'
      - 'v225-04.b64'
      - 'v225-05.b64'
      - 'v225-06.b64'
      - 'v225-07.b64'
      - 'v225-08.b64'
      - '.github/workflows/build-v225.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct direct application HTML
        shell: bash
        run: |
          set -euo pipefail
          {
            cat v225-01.b64 v225-02.b64 v225-03.b64 v225-04.b64 v225-05.b64
            head -c 6512 v225-06.b64
            head -c 6516 v225-07.b64
            cat v225-08.b64
          } | tr -d '\r\n\t ' | base64 -d | gzip -dc > index.new.html
          grep -q 'V2.25' index.new.html
          grep -q 'APPLICATION COMPLETE' index.new.html
          test "$(wc -c < index.new.html)" -gt 100000
          mv index.new.html index.html

      - name: Commit direct index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No change to commit'
            exit 0
          fi
          git commit -m 'Construire index V2.25 direct sans fetch navigateur'
          git push
