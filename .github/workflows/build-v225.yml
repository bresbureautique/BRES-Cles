name: Build BRES V2.26 direct patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v225.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activate V2.26 patch
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'v226-patch.js' index.html; then
            sed -i 's#</body>#<script src="v226-patch.js?v=226"></script></body>#' index.html
          fi
          sed -i 's/V2\.25/V2.26/g' index.html
          grep -q 'v226-patch.js' index.html
          grep -q 'V2.26' index.html

      - name: Commit V2.26
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No change to commit'
            exit 0
          fi
          git commit -m 'Activer BRES V2.26 anti faux positif'
          git push
