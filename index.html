<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BRES Clés — Chargement V2.25</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#173b63;color:white;display:grid;place-items:center;min-height:100vh;text-align:center}.box{padding:24px}.badge{background:#ff8a00;padding:12px 16px;border-radius:12px;font-weight:900;font-size:18px}.small{margin-top:14px;opacity:.9;line-height:1.45}
</style>
</head>
<body>
<div class="box"><div class="badge">BRES CLÉS V2.25 — APPLICATION COMPLETE</div><div class="small" id="msg">Chargement de l’application…</div></div>
<script>
(async()=>{
 try{
  const files=['app-v225.gz.b64','app-v225-part2.b64','app-v225-part3.b64'];
  const parts=[];
  for(const f of files){
   const r=await fetch(f+'?v=225-fix2',{cache:'no-store'});
   if(!r.ok) throw new Error('fichier application introuvable : '+f);
   parts.push((await r.text()).replace(/\s+/g,''));
  }
  const b64=parts.join('');
  if(b64.length%4!==0) throw new Error('fichier application incomplet ('+b64.length+')');
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  if(typeof DecompressionStream==='undefined') throw new Error('décompression non prise en charge par ce navigateur');
  const ds=new DecompressionStream('gzip');
  const stream=new Blob([bytes]).stream().pipeThrough(ds);
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(e){
  document.getElementById('msg').textContent='Chargement impossible : '+(e.message||e)+'.';
 }
})();
</script>
</body>
</html>
